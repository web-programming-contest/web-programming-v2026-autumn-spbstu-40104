<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Продажи за месяц</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Продажи за месяц</h1>
      <table>
        <caption>
          Отчёт о продажах за ноябрь
        </caption>
        <thead>
          <tr>
            <th scope="col">Продукт</th>
            <th scope="col">Продано</th>
            <th scope="col">Выручка</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Ноутбук</th>
            <td>12</td>
            <td>720 000 ₽</td>
          </tr>
          <tr>
            <th scope="row">Смартфон</th>
            <td>25</td>
            <td>750 000 ₽</td>
          </tr>
          <tr>
            <th scope="row">Наушники</th>
            <td>40</td>
            <td>120 000 ₽</td>
          </tr>
          <tr>
            <th scope="row">Монитор</th>
            <td>8</td>
            <td>160 000 ₽</td>
          </tr>
          <tr>
            <th scope="row">Клавиатура</th>
            <td>15</td>
            <td>45 000 ₽</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row">Итого</th>
            <td>100</td>
            <td>1 795 000 ₽</td>
          </tr>
        </tfoot>
      </table>
    </main>
  </body>
</html>
