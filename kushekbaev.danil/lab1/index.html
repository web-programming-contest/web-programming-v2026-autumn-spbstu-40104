<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма регистрации — Lab1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <!-- Перенесли form-grid прямо на form -->
      <form
        class="registration-form form-grid"
        action="#"
        method="post"
        novalidate
      >
        <h1 class="form-title">Регистрация</h1>

        <label for="firstName">Имя</label>
        <input type="text" id="firstName" name="firstName" required />

        <label for="lastName">Фамилия</label>
        <input type="text" id="lastName" name="lastName" required />

        <span class="field-label" id="gender-label">Пол</span>
        <div class="radio-group" role="group" aria-labelledby="gender-label">
          <label class="option">
            <input type="radio" name="gender" value="male" required />
            Мужской
          </label>
          <label class="option">
            <input type="radio" name="gender" value="female" />
            Женский
          </label>
        </div>

        <span class="field-label" id="lang-label">Владение языками</span>
        <div class="checkbox-group" role="group" aria-labelledby="lang-label">
          <label class="option">
            <input type="checkbox" name="languages[]" value="ru" />
            Русский
          </label>
          <label class="option">
            <input type="checkbox" name="languages[]" value="ef" />
            Эльфийский
          </label>
          <label class="option">
            <input type="checkbox" name="languages[]" value="nv" />
            Навахо
          </label>
          <label class="option">
            <input type="checkbox" name="languages[]" value="gn" />
            Гуарани
          </label>
          <label class="option">
            <input type="checkbox" name="languages[]" value="iu" />
            Инуитский
          </label>
        </div>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
      </form>
    </main>
  </body>
</html>
