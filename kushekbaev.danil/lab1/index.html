<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации — Lab1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page">
        <form class="registration-form" action="#" method="post" novalidate>
            <h1 class="form-title">Регистрация</h1>

            <div class="form-grid">
                <label for="firstName">Имя</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Фамилия</label>
                <input type="text" id="lastName" name="lastName" required>

                <span class="field-label">Пол</span>
                <fieldset class="radio-group">
                    <legend class="visually-hidden">Пол</legend>
                    <label class="option">
                        <input type="radio" name="gender" value="male" required>
                        Мужской
                    </label>
                    <label class="option">
                        <input type="radio" name="gender" value="female">
                        Женский
                    </label>
                </fieldset>

                <span class="field-label">Владение языками</span>
                <fieldset class="checkbox-group">
                    <legend class="visually-hidden">Владение языками</legend>
                    <label class="option">
                        <input type="checkbox" name="languages" value="ru">
                        Русский
                    </label>
                    <label class="option">
                        <input type="checkbox" name="languages" value="ef">
                        Эльфийский
                    </label>
                    <label class="option">
                        <input type="checkbox" name="languages" value="nv">
                        Навахо
                    </label>
                    <label class="option">
                        <input type="checkbox" name="languages" value="gn">
                        Гуарани
                    </label>
                    <label class="option">
                        <input type="checkbox" name="languages" value="iu">
                        Инуитский
                    </label>
                </fieldset>
            </div>

            <button type="submit" class="submit-btn">Зарегистрироваться</button>
        </form>
    </main>
</body>
</html>
