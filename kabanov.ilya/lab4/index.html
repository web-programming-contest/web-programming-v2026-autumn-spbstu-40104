<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Студенты и оценки</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Студенты</h1>
      <form data-testid="entity-form">
        <input
          name="id"
          type="number"
          placeholder="ID"
          aria-label="ID"
          required
        />
        <input
          name="name"
          type="text"
          placeholder="Имя"
          aria-label="Имя"
          required
        />
        <button type="submit">Добавить студента</button>
      </form>
      <section
        class="cards"
        data-testid="entity-list"
        aria-label="Список студентов"
      ></section>
      <datalist id="subjects"></datalist>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
